[package]
name = "rbrprinter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dotenvy = "0.15"

eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow"
] }

reqwest = { version = "0.13", features = ["blocking"] }
serde_json = "1"
tempfile = "3"

tungstenite = {
    version = "0.30.0",
    features = ["rustls-tls-webpki-roots"]
}

url = "2"
urlencoding = "2"
lopdf = "0.44.0"